<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- LASTROOT app icon (own art, placeholder for final branding).
       Turquoise heart inside a faceted tree crown on deep night blue.
       Big flat shapes so it stays readable down to 16 px. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#16244a"/>
      <stop offset="0.6" stop-color="#0c1430"/>
      <stop offset="1" stop-color="#060a1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3ff2d6" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#22b8a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- roots + trunk -->
  <path d="M222 330 L290 330 L298 404 C302 430 330 446 384 456 L398 470 L114 470 L128 456 C182 446 210 430 214 404 Z" fill="#6b4a2f"/>
  <path d="M256 330 L290 330 L298 404 C302 430 330 446 384 456 L398 470 L256 470 Z" fill="#3f2a1b"/>
  <!-- crown: faceted silhouette -->
  <polygon points="256,40 356,72 432,140 462,232 424,318 336,362 256,372 176,362 88,318 50,232 80,140 156,72" fill="#173f30"/>
  <polygon points="256,40 156,72 80,140 50,232 256,214" fill="#2a6b45"/>
  <polygon points="256,40 356,72 432,140 256,214" fill="#22593d"/>
  <polygon points="50,232 88,318 176,362 256,214" fill="#1f5038"/>
  <polygon points="462,232 424,318 336,362 256,214" fill="#133526"/>
  <polygon points="256,40 156,72 210,110" fill="#3f8a52"/>
  <!-- heart glow + heart -->
  <circle cx="256" cy="218" r="150" fill="url(#glow)"/>
  <path d="M256 322 C196 278 156 246 156 202 C156 170 180 146 210 146 C232 146 248 158 256 176 C264 158 280 146 302 146 C332 146 356 170 356 202 C356 246 316 278 256 322 Z" fill="#3ff2d6"/>
  <path d="M256 322 C316 278 356 246 356 202 C356 170 332 146 302 146 C280 146 264 158 256 176 Z" fill="#22b8a6"/>
  <path d="M176 196 C176 176 192 164 210 164 C222 164 232 170 238 180 Z" fill="#b8fff2"/>
  <!-- the last root: a thin turquoise vein from the heart into the ground -->
  <path d="M252 320 L260 320 L262 452 L250 452 Z" fill="#3ff2d6" opacity="0.85"/>
</svg>
